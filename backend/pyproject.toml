[project]
name = "taller-mecanico-backend"
version = "0.1.0"
description = "API REST para Taller Mecánico"
requires-python = ">=3.13,<3.15"
dependencies = [
  "cryptography==44.0.0",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "passlib[argon2]==1.7.4",
  "pydantic-settings==2.7.0",
  "pydantic[email]==2.10.3",
  "PyJWT==2.10.1",
  "pymysql==1.1.1",
  "pytest==8.3.4",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.32.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
